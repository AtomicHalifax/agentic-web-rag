name: deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: deploy, cancel-in-progress: true }
jobs:
  worker:
    # Needs repo secret CLOUDFLARE_API_TOKEN (docs/SETUP.md). Account ID lives in worker/wrangler.toml.
    runs-on: ubuntu-latest
    outputs: { url: "${{ steps.w.outputs.deployment-url }}" }
    steps:
      - uses: actions/checkout@v4
      - id: has
        env: { T: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: echo "cf=$([ -n "$T" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - id: w
        if: steps.has.outputs.cf == 'yes'
        working-directory: worker
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: |
          set -o pipefail
          npx -y wrangler@4 deploy 2>&1 | tee out.txt || { echo '```' >> "$GITHUB_STEP_SUMMARY"; tail -40 out.txt >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' out.txt | head -1)
          echo "deployment-url=$url" >> "$GITHUB_OUTPUT"
          echo "Worker: $url" >> "$GITHUB_STEP_SUMMARY"
  pages:
    needs: worker
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - name: Point the site at the Worker
        if: ${{ needs.worker.outputs.url != '' }}
        env: { API_URL: "${{ needs.worker.outputs.url }}" }
        run: |
          sed -i "s|: \"\";\$|: \"$API_URL\";|" web/config.js
          cat web/config.js
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: d
        uses: actions/deploy-pages@v4
