name: deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: deploy, cancel-in-progress: true }
jobs:
  worker:
    # Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (docs/SETUP.md).
    runs-on: ubuntu-latest
    outputs: { url: "${{ steps.w.outputs.deployment-url }}" }
    steps:
      - uses: actions/checkout@v4
      - id: has
        env: { T: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: echo "cf=$([ -n "$T" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - id: w
        if: steps.has.outputs.cf == 'yes'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
  pages:
    needs: worker
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - name: Point the site at the Worker
        if: ${{ needs.worker.outputs.url != '' }}
        env: { API_URL: "${{ needs.worker.outputs.url }}" }
        run: |
          sed -i "s|: \"\";\$|: \"$API_URL\";|" web/config.js
          cat web/config.js
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: d
        uses: actions/deploy-pages@v4
