name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm test
  eval:
    # Same pipeline the browser runs: real crawl (Jina Reader) + real models. Gate fails the build if quality drops.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/cache@v4
        with: { path: node_modules/@huggingface/transformers/.cache, key: models-v1 }
      - run: npm install --no-audit --no-fund
      - run: node evals/run.js | tee -a "$GITHUB_STEP_SUMMARY"
