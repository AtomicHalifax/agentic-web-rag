name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm test
  eval:
    # The same crawl + retrieval code the browser runs, replayed from recorded pages (record-evals.yml). Fails the build if quality drops.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node evals/run.js | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash  # bash here means -o pipefail, so a failed eval fails the job
